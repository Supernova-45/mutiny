name: Check mutiny
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
      - run: npm run test:focus-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-parity-failure
          path: |
            work/deployment-check/
            work/focus-check/
